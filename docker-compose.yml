services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: security-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in your .env file}"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      # Named volume: keeps SQL Server data across container recreation.
      # Do NOT run `docker compose down -v`, it would delete this volume.
      - security_sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - security-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: security-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      # The API connects to SQL Server using the docker-compose service name
      # ("sqlserver"), never "localhost". The connection string intentionally
      # omits the SQL auth secret; Db__SqlAuthSecret supplies it separately
      # so no credential is embedded as literal text in this file.
      ConnectionStrings__SecurityDatabase: "Server=sqlserver,1433;Database=DEMO;User Id=sa;TrustServerCertificate=True;"
      Db__SqlAuthSecret: "${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in your .env file}"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - security-network

networks:
  security-network:
    driver: bridge

volumes:
  # Persists SQL Server data on the host so it survives container removal
  # (docker compose rm / recreate). Only destroyed by an explicit
  # `docker volume rm` or `docker compose down -v` — avoid the latter in
  # normal development.
  security_sqlserver_data:
